name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build TypeScript
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Verify dist files exist
        run: node -e "const fs = require('fs'); ['dist/index.js','dist/db/index.js','dist/db/store.js','dist/search/fts.js'].forEach(f => { if (!fs.existsSync(f)) { console.error('Missing:', f); process.exit(1); } }); console.log('All dist files present');"

  plugin-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate plugin.json
        run: |
          node -e "
            const plugin = require('./.claude-plugin/plugin.json');
            if (!plugin.name) throw new Error('Missing plugin name');
            if (!plugin.version) throw new Error('Missing plugin version');
            if (!plugin.skills) throw new Error('Missing skills array');
            console.log('Plugin validation passed:', plugin.name, 'v' + plugin.version);
          "

      - name: Validate hooks.json
        run: |
          node -e "
            const config = require('./hooks/hooks.json');
            if (!config.hooks || typeof config.hooks !== 'object') throw new Error('Invalid hooks.json');
            const hookTypes = Object.keys(config.hooks);
            if (hookTypes.length === 0) throw new Error('No hooks configured');
            console.log('Hooks validation passed:', hookTypes.length, 'hook types configured:', hookTypes.join(', '));
          "

      - name: Check required files exist
        run: node -e "const fs = require('fs'); ['skills/pro-workflow/SKILL.md','commands/wrap-up.md','commands/learn.md','commands/search.md','commands/doctor.md','commands/export.md','commands/import.md','README.md'].forEach(f => { if (!fs.existsSync(f)) { console.error('Missing:', f); process.exit(1); } }); console.log('All required files present');"
